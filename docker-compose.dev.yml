# Local development: only Postgres runs in Docker; apps run with `pnpm dev` on the host.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: avis
      POSTGRES_PASSWORD: avis
      POSTGRES_DB: avisboost
    ports: ["5432:5432"]
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avis -d avisboost"]
      interval: 5s
      retries: 20

volumes:
  pgdata-dev:
